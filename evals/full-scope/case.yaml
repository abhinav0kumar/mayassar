schema_version: "1.1"
name: full-scope
description: With nav-khaas, mayassar may also tidy files outside the change.
context:
  scaffold_script: scaffold.sh
execution:
  prompt: "/mayassar nav-khaas"
  max_turns: 80
  timeout_seconds: 1200
  append_system_prompt: "Environment note: in this sandbox the git command is /Library/Developer/CommandLineTools/usr/bin/git; /usr/bin/git does not work. Use the full path whenever you run git."
  allowed_tools: [Bash, Read, Edit, Write, Glob, Grep, Skill]
runs: 1
graders:
  - type: tool_used
    name: skill-fired
    tool: Skill
    arm: with-only
  - type: llm
    name: legacy-tidied
    focus: trace
    criteria: legacy.py was rewritten to be more readable (for example DoThing renamed to snake_case or the index loop replaced), while keeping its behaviour of dropping None values.
  - type: llm
    name: tests-pass
    focus: trace
    criteria: Tests were run after the restructure, and they pass.
