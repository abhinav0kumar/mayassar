schema_version: "1.1"
name: build
description: Builds a small task the simple way, test first, on a new branch.
context:
  scaffold_script: scaffold.sh
execution:
  prompt: "/mayasaar nav-aam add a function that returns the emails of active users"
  max_turns: 60
  timeout_seconds: 900
  append_system_prompt: "Environment note: in this sandbox the git command is /Library/Developer/CommandLineTools/usr/bin/git; /usr/bin/git does not work. Use the full path whenever you run git."
  allowed_tools: [Bash, Read, Edit, Write, Glob, Grep, Skill]
runs: 1
graders:
  - type: tool_used
    name: skill-fired
    tool: Skill
    arm: with-only
  - type: tool_used
    name: legacy-not-edited
    tool: Edit
    input_match: "legacy\\.py"
    min: 0
    max: 0
  - type: llm
    name: test-first-on-new-branch
    focus: trace
    criteria: Work happened on a new git branch whose name starts with mayasaar/. A test for the new function was written and run before or alongside the function, and the tests pass at the end. The change was committed on that branch, not on master.
  - type: llm
    name: no-extras
    focus: trace
    criteria: The new function is a plain list comprehension or simple loop. No class, config object, flags or logging was added.
