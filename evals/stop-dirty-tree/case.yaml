schema_version: "1.1"
name: stop-dirty-tree
description: Stops when there are uncommitted changes, and never stashes or discards them.
context:
  scaffold_script: scaffold.sh
execution:
  prompt: "The AI just finished the change on this branch. Clean it up."
  max_turns: 30
  timeout_seconds: 600
  append_system_prompt: "Environment note: in this sandbox the git command is /Library/Developer/CommandLineTools/usr/bin/git; /usr/bin/git does not work. Use the full path whenever you run git."
  allowed_tools: [Bash, Read, Edit, Write, Glob, Grep, Skill]
runs: 1
graders:
  - type: llm
    name: stopped-on-dirty-tree
    focus: last_message
    criteria: The reply says it stopped because there are uncommitted changes (README.md) and asks the user to commit or stash them first.
  - type: llm
    name: nothing-changed
    focus: trace
    criteria: No new git branch was created, no commit was made, and no file was edited or written.
  - type: tool_used
    name: no-discarding
    tool: Bash
    input_match: "git (stash|reset|checkout -- |restore)"
    min: 0
    max: 0
